
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
    id 'org.jetbrains.kotlin.android'
}

def gitCommitHash = providers.exec {
    commandLine("git", "rev-parse", "--verify", "--short", "HEAD")
}.standardOutput.asText.get().trim()


android {
    compileSdk 35

    defaultConfig {
        applicationId "ani.saikou"
        minSdk 24
        targetSdk 34
        versionCode ((System.currentTimeMillis() / 60000).toInteger())
        versionName "1.2.5"
        signingConfig signingConfigs.debug
    }

    buildTypes {
        debug {
            applicationIdSuffix ".beta"
            debuggable true
            versionNameSuffix "." + gitCommitHash
            buildConfigField "String", "SUPER_CLIPPING", "\"${project.findProperty('MUST_BE_THE_WATER') ?: ""}\""
            buildConfigField "String", "MY_CUSTOM_API_KEY", "\"${project.findProperty('API_KEY')}\""
            buildConfigField "String", "SERVER_URL", "\"${project.findProperty('HOST_URL') ?: ""}\""
            buildConfigField "long", "BUILD_TIME", "${System.currentTimeMillis()}L"
        }
        release {
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
        compose  = true
        composeOptions{
            kotlinCompilerExtensionVersion = "1.5.15"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'ani.saikou'
}

dependencies {
//    Core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'com.github.Blatzar:NiceHttp:0.4.11'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

//    Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

//    FireBase
    //implementation platform('com.google.firebase:firebase-bom:32.2.3')
    //implementation 'com.google.firebase:firebase-analytics-ktx:21.3.0'
    //implementation 'com.google.firebase:firebase-crashlytics-ktx:18.4.1'

//    Exoplayer
    ext.exo_version = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$exo_version"
    implementation "androidx.media3:media3-ui:$exo_version"
    implementation "androidx.media3:media3-exoplayer-hls:$exo_version"
    implementation "androidx.media3:media3-exoplayer-dash:$exo_version"
    implementation "androidx.media3:media3-datasource-okhttp:$exo_version"
    implementation "androidx.media3:media3-session:$exo_version"

//    UI
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'nl.joery.animatedbottombar:library:1.1.0'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'com.flaviofaria:kenburnsview:1.0.7'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'com.alexvasilkov:gesture-views:2.8.3'
    implementation 'com.github.VipulOG:ebook-reader:0.1.6'

/// Lifecycle view model
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7")


    /// mpv lib
    implementation("io.github.abdallahmehiz:mpv-android-lib:0.1.12")

    // compose
    def composeBom = platform('androidx.compose:compose-bom:2024.04.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Core integration with Activities & Foundation Layouts
    implementation 'androidx.activity:activity-compose:1.8.2' 
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'

    // Design System (Material Design 3)
    implementation 'androidx.compose.material3:material3'

    // Icons (Core + Full Extended Pack)
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    /// constraint layout
    implementation("androidx.constraintlayout:constraintlayout-compose:1.0.1")

    //animation
    implementation("androidx.compose.animation:animation-graphics")

    // Developer & Tooling Previews
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI Architecture & Test utilities
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

// koin
    def koin_version = "3.5.6"
    def koin_compose_version = "3.5.6"

    implementation "io.insert-koin:koin-android:$koin_version"
    implementation "io.insert-koin:koin-androidx-compose:$koin_compose_version"

    //seeker
    implementation "com.github.abdallahmehiz:seeker:2.0.1"

/// koylin collections
    implementation("org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.8")


}
